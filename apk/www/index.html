document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    <div style=\"flex: 1; min-width: 0; font-size: 14px;\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #6B7075; font-family: 'IBM Plex Mono', monospace;\">{{ t.time }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 0 auto; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 10px;\">\n        <div sc-camel-on-click=\"{{ recheck }}\" style=\"height: 56px; display: flex; align-items: center; justify-content: center; background: #16181A; color: #FFFFFF; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; user-select: none;\" style-active=\"background: #2E3237;\">{{ recheckLabel }}<\u002Fdiv>\n        <div style=\"display: flex; gap: 10px;\">\n          <div style=\"flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #E2E2DE; border-radius: 12px; background: #FFFFFF; font-size: 16px; cursor: pointer; user-select: none;\" style-active=\"background: #F0F0EC;\">Печать<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 20; background: #F4F4F2; display: flex; flex-direction: column;\">\n      <div style=\"flex: 0 0 auto; height: 34px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: #16181A;\">\n        <div>{{ clockStr }}<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 6px;\">\n          <div style=\"width: 18px; height: 10px; border: 1.5px solid #16181A; border-radius: 3px; opacity: 0.55;\"><\u002Fdiv>\n          <div style=\"width: 22px; height: 11px; border: 1.5px solid #16181A; border-radius: 3px; opacity: 0.55;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 0; display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"display: flex; align-items: center; gap: 10px;\">\n          <img src=\"e47e16be-c837-4d9d-92fc-6d05ebc50169\" alt=\"ActivBank QR\" style=\"width: 44px; height: 44px; border-radius: 11px; object-fit: cover; display: block;\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n            <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: #16181A;\">ActivBank QR<\u002Fdiv>\n            <div style=\"font-size: 11px; letter-spacing: 0.06em; color: #9AA0A6; font-family: 'IBM Plex Mono', monospace;\">кабинет мерчанта<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ authPhone }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: #16181A;\">Вход для мерчантов<\u002Fdiv>\n              <div style=\"font-size: 14px; line-height: 1.5; color: #6B7075; text-wrap: pretty;\">Укажите номер, привязанный к вашей точке. Проверим его в базе банка.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #FFFFFF; border: 1.5px solid {{ phoneBorder }}; border-radius: 16px;\">\n              <div style=\"font-size: 18px; color: #6B7075; font-family: 'IBM Plex Mono', monospace;\">+992<\u002Fdiv>\n              <div style=\"font-size: 18px; letter-spacing: 0.12em; color: #16181A; font-family: 'IBM Plex Mono', monospace;\">{{ phoneMask }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ authCode }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"font-size: 13px; line-height: 1.45; color: #6B7075;\">{{ codeSub }}<\u002Fdiv>\n            <div style=\"display: flex; gap: 10px;\">\n              <sc-for list=\"{{ codeCells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"flex: 1; height: 68px; background: #FFFFFF; border: 1.5px solid {{ c.border }}; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;\">{{ c.ch }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n              <div sc-camel-on-click=\"{{ backToPhone }}\" style=\"font-size: 14px; color: #0E8F6F; cursor: pointer; user-select: none;\">Изменить номер<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ resend }}\" style=\"font-size: 14px; color: {{ resendColor }}; cursor: pointer; user-select: none; font-family: 'IBM Plex Mono', monospace;\">{{ resendLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 14px 16px; border-radius: 12px; background: #FDECEA; font-size: 14px; line-height: 1.45; color: #B3352F; text-wrap: pretty;\">{{ authErrorText }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"flex: 1; min-height: 24px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 0 auto; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 14px;\">\n        <div sc-camel-on-click=\"{{ authSubmit }}\" style=\"height: 58px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: {{ authBtnBg }}; color: {{ authBtnFg }}; font-size: 17px; font-weight: 600; cursor: pointer; user-select: none;\">{{ authBtnLabel }}<\u002Fdiv>\n\n        <sc-if value=\"{{ showKeypad }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;\">\n            <sc-for list=\"{{ authKeys }}\" as=\"k\" hint-placeholder-count=\"12\">\n              <div sc-camel-on-click=\"{{ k.press }}\" style=\"height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: {{ k.bg }}; font-size: 21px; font-weight: 500; color: #16181A; cursor: pointer; user-select: none;\" style-active=\"background: #E4E4DF;\">{{ k.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 900}, &quot;apiBaseUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;http://10.64.20.101:8888&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Бэкенд&quot;}, &quot;allowDemoFallback&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Бэкенд&quot;}, &quot;connection&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Онлайн&quot;, &quot;Нестабильно&quot;, &quot;Нет связи&quot;], &quot;default&quot;: &quot;Онлайн&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Бэкенд&quot;}, &quot;pollSeconds&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 2, &quot;max&quot;: 30, &quot;step&quot;: 1, &quot;default&quot;: 5, &quot;unit&quot;: &quot; с&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Бэкенд&quot;}}\">\n/* ── Точки интеграции с бэком ────────────────────────────────────────\n   Пока baseUrl пустой — экраны живут на моках. Придут эндпоинты:\n   заполнить baseUrl + paths, остальную логику не трогать.\n\n   POST otpRequest    { phone }                -> { ok }\n   POST /pos/login    { phone }\n        -> 200 { ok, terminalId, terminalName, storeName }\n        -> 404 «терминал не найден» · 403 «не наш мерчант»\n   GET  /pos/terminal?phone=…\n        -> { terminal: { terminalName, terminalPhone, storeName, terminalQR },\n             last_payment: { sender, amount, status, creation_datetime } | null }\n   GET  /pos/history?phone=…\n        -> { terminal: {…}, count, payments: [{ sender, amount, status, creation_datetime }] }\n\n   Что меняется на фронте:\n   · вход           — телефон уходит в /pos/login, ошибка 404/403 показывается под полем\n   · экран «Главная»— storeName (название точки), terminalName (ID), terminalQR (payload QR),\n                      last_payment (карточка «Последний платёж»), суммы за сегодня — из payments\n   · «История»      — payments из /pos/history; pull-to-refresh перезапрашивает список,\n                      новые creation_datetime поднимаются вверх\n   · sender         — id банка-отправителя, резолвится в имя через BANKS\n   · amount         — TJS с копейками (float из бэка), НЕ центы\n──────────────────────────────────────────────────────────────────── */\nconst API = {\n  baseUrl: \"\",\n  timeoutMs: 8000,\n  paths: {\n    login: \"/pos/login\",\n    terminal: \"/pos/terminal\",\n    history: \"/pos/history\"\n  }\n};\n\nconst hhmm = (d) => String(d.getHours()).padStart(2, \"0\") + \":\" + String(d.getMinutes()).padStart(2, \"0\");\nconst money = (v) => {\n  const n = Math.max(0, Number(v) || 0);\n  const int = String(Math.floor(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, \" \");\n  return int + \",\" + String(Math.round((n - Math.floor(n)) * 100)).padStart(2, \"0\") + \" TJS\";\n};\n\n/* sender из incoming_tx -> отображаемое имя банка */\nconst BANKS = {\n  \"1\": \"Алиф Банк\", \"2\": \"Эсхата\", \"3\": \"Амонатбонк\", \"4\": \"Душанбе Сити\",\n  \"5\": \"Спитамен Банк\", \"6\": \"Ориён Банк\"\n};\nconst bankName = (sender) => BANKS[String(sender)] || (sender != null ? \"Банк \" + sender : \"—\");\n\n/* статусы бэка -> статусы UI */\nconst STMAP = {\n  success: \"success\", ok: \"success\", accepted: \"success\", completed: \"success\", paid: \"success\",\n  pending: \"pending\", new: \"pending\", processing: \"pending\", created: \"pending\",\n  declined: \"declined\", failed: \"declined\", error: \"declined\", rejected: \"declined\",\n  expired: \"expired\", timeout: \"expired\",\n  refunded: \"refunded\", refund: \"refunded\", reversed: \"refunded\"\n};\nconst uiStatus = (s) => STMAP[String(s || \"\").toLowerCase()] || \"pending\";\n\n/* incoming_tx -> строка истории */\nconst normTx = (tx, i) => {\n  const dt = tx.creation_datetime ? new Date(tx.creation_datetime) : new Date();\n  return {\n    id: \"TX-\" + (tx.creation_datetime || i),\n    ts: dt.getTime(),\n    time: hhmm(dt),\n    date: String(dt.getDate()).padStart(2, \"0\") + \".\" + String(dt.getMonth() + 1).padStart(2, \"0\"),\n    amount: Number(tx.amount) || 0,\n    sender: tx.sender,\n    bank: bankName(tx.sender),\n    payer: bankName(tx.sender),\n    status: uiStatus(tx.status)\n  };\n};\n\n/* демо-ответ /pos/history в точном формате incoming_tx */\nconst iso = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };\nconst SEED_TX = [\n  { sender: \"1\", amount: 245.0, status: \"success\", creation_datetime: iso(14, 26) },\n  { sender: \"2\", amount: 80.0, status: \"success\", creation_datetime: iso(14, 11) },\n  { sender: \"3\", amount: 1320.0, status: \"refunded\", creation_datetime: iso(13, 58) },\n  { sender: \"1\", amount: 159.0, status: \"failed\", creation_datetime: iso(13, 44) },\n  { sender: \"4\", amount: 460.5, status: \"success\", creation_datetime: iso(13, 20) },\n  { sender: \"2\", amount: 75.0, status: \"expired\", creation_datetime: iso(12, 52) },\n  { sender: \"1\", amount: 2100.0, status: \"success\", creation_datetime: iso(12, 31) },\n  { sender: \"3\", amount: 335.0, status: \"success\", creation_datetime: iso(11, 47) }\n];\nconst SEED = SEED_TX.map(normTx);\n\nconst ST = {\n  success: { label: \"Оплачено\", bg: \"#E8F5F0\", fg: \"#0B7259\", dot: \"#0E8F6F\" },\n  pending: { label: \"Ожидание\", bg: \"#FFF6E5\", fg: \"#8A5A00\", dot: \"#D89A1F\" },\n  declined: { label: \"Отказ\", bg: \"#FDECEA\", fg: \"#B3352F\", dot: \"#C9403A\" },\n  expired: { label: \"Истёк\", bg: \"#F0F0EC\", fg: \"#6B7075\", dot: \"#9AA0A6\" },\n  refunded: { label: \"Возврат\", bg: \"#EEF1FB\", fg: \"#3B4E8F\", dot: \"#5A6FB5\" }\n};\n\n\nclass Component extends DCLogic {\n  state = {\n    authed: false, aMode: null, aStep: \"phone\", phone: \"\", code: \"\",\n    login: \"\", pass: \"\", showPass: false, aErr: \"\", aLoading: false, resendIn: 0,\n    ops: [], filter: \"Все\", selId: null, sinceSync: 0, syncOk: true, pull: 0, pulling: false,\n    tab: \"home\", screen: \"list\", amount: \"\", result: null, attempt: 0, payer: \"\",\n    storeName: \"\", terminalName: \"\", terminalPhone: \"\", terminalQR: \"\", lastPay: null,\n    terminal: \"—\", now: new Date()\n  };\n\n  mockList = SEED_TX.slice();\n\n  componentDidMount() {\n    this.clock = setInterval(() => this.tick(), 1000);\n    import(\"./qr-encode.js\").then((mod) => { this.qrFn = mod.qrMatrix; this.forceUpdate(); }).catch(() => {});\n  }\n\n  /* заглушка, пока terminalQR не пришёл с бэка */\n  placeholderQr() {\n    const out = [];\n    for (let r = 0; r < 25; r++) for (let c = 0; c < 25; c++) {\n      const zones = [[0, 0], [0, 18], [18, 0]];\n      let fz = 0;\n      for (let z = 0; z < 3; z++) {\n        const dr = r - zones[z][0], dc = c - zones[z][1];\n        if (dr >= 0 && dr < 7 && dc >= 0 && dc < 7) {\n          fz = Math.max(Math.abs(dr - 3), Math.abs(dc - 3)) === 3 || Math.max(Math.abs(dr - 3), Math.abs(dc - 3)) <= 1 ? 1 : 2;\n        }\n      }\n      out.push({ c: (fz ? fz === 1 : false) ? \"#16181A\" : fz ? \"transparent\" : \"#E4E4DF\" });\n    }\n    return out;\n  }\n\n  /* матрица QR строится из terminalQR, полученного с бэка */\n  qrGrid(payload) {\n    if (!this.qrFn || !payload) return null;\n    if (this.qrCache && this.qrCache.payload === payload) return this.qrCache.grid;\n    try {\n      const g = this.qrFn(payload);\n      this.qrCache = { payload: payload, grid: g };\n      return g;\n    } catch (e) { return null; }\n  }\n  componentWillUnmount() { clearInterval(this.clock); clearTimeout(this.at); clearTimeout(this.pt); clearTimeout(this.qt); clearTimeout(this.wt); }\n\n  listRef = (el) => { this.list = el; };\n\n  pullStart = (e) => {\n    if (this.state.pulling || !this.list || this.list.scrollTop > 0) return;\n    const t = e.touches ? e.touches[0] : e;\n    this.y0 = t.clientY;\n  };\n  pullMove = (e) => {\n    if (this.y0 == null || this.state.pulling) return;\n    const t = e.touches ? e.touches[0] : e;\n    const dy = t.clientY - this.y0;\n    if (dy <= 0) return this.setState({ pull: 0 });\n    if (e.cancelable) e.preventDefault();\n    this.setState({ pull: Math.min(96, dy * 0.7) });\n  };\n  pullEnd = () => {\n    this.y0 = null;\n    if (this.state.pull >= 48) return this.doRefresh();\n    this.setState({ pull: 0 });\n  };\n  pullWheel = (e) => {\n    if (this.state.pulling || !this.list || this.list.scrollTop > 0 || e.deltaY >= 0) return;\n    const next = Math.min(96, this.state.pull - e.deltaY * 1.2);\n    this.setState({ pull: next });\n    clearTimeout(this.wt);\n    this.wt = setTimeout(() => this.pullEnd(), 220);\n  };\n\n  doRefresh() {\n    if (this.state.pulling) return;\n    this.setState({ pull: 56, pulling: true });\n    if (!this.base() || this.fellBack) this.mockList = [this.mockTx()].concat(this.mockList);\n    this.api(\"history\", {})\n      .then((r) => {\n        this.applyTerminal(r && r.terminal);\n        this.applyPayments(r && r.payments);\n        this.setState({ pulling: false, pull: 0 });\n      })\n      .catch(() => this.setState({ pulling: false, pull: 0, syncOk: false }));\n  }\n\n  offline() { return (this.props.connection ?? \"Онлайн\") === \"Нет связи\"; }\n  pollSec() { return Math.max(2, Math.round(this.props.pollSeconds ?? 5)); }\n\n  tick() {\n    const s = this.state;\n    const patch = { now: new Date() };\n    if (s.resendIn > 0) patch.resendIn = s.resendIn - 1;\n    if (s.authed) patch.sinceSync = s.sinceSync + 1;\n    this.setState(patch);\n  }\n\n  base() { return (this.props.apiBaseUrl ?? API.baseUrl ?? \"http://10.64.20.101:8888\").replace(/\\/$/, \"\"); }\n  fullPhone() { return \"+992\" + this.state.phone; }\n\n  api(name, payload) {\n    if (this.offline()) return Promise.reject(new Error(\"offline\"));\n    const demoOk = this.props.allowDemoFallback ?? false;\n    if (!this.base() || (demoOk && this.fellBack)) return this.mock(name, payload);\n    const get = name !== \"login\";\n    const q = get ? \"?phone=\" + encodeURIComponent((payload && payload.phone) || this.fullPhone()) : \"\";\n    const ctl = new AbortController();\n    const kill = setTimeout(() => ctl.abort(), API.timeoutMs);\n    return fetch(this.base() + API.paths[name] + q, {\n      method: get ? \"GET\" : \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: get ? undefined : JSON.stringify(payload || {}),\n      signal: ctl.signal\n    })\n      .then((r) => r.json().then((body) => {\n        if (!r.ok) throw Object.assign(new Error(\"http\"), { code: r.status, detail: body && body.detail });\n        return body;\n      }))\n      .catch((e) => {\n        /* хост недоступен (превью вне сети банка) — уходим в демо-бэк с теми же формами ответов */\n        if (e && e.code) throw e;\n        /* fail-closed: сетевую ошибку нельзя молча подменять демо-данными */\n        if (!demoOk) {\n          throw Object.assign(new Error(\"network\"), { code: 0, detail: \"Нет связи с сервером \" + this.base() });\n        }\n        this.fellBack = true;\n        return this.mock(name, payload);\n      })\n      .finally(() => clearTimeout(kill));\n  }\n\n  /* демо-бэк: те же формы ответов, что у FastAPI */\n  mock(name, payload) {\n    const wait = (ms, val) => new Promise((res, rej) => { this.pt = setTimeout(() => (val instanceof Error ? rej(val) : res(val)), ms); });\n    const term = { terminalName: \"T-04\", terminalPhone: this.fullPhone(), storeName: \"Кафе «Рохат»\", terminalQR: \"https://qr.activbank.tj/t/40219\" };\n    if (name === \"login\") {\n      if ((payload.phone || \"\").endsWith(\"000\")) return wait(700, Object.assign(new Error(\"http\"), { code: 404, detail: \"Терминал с таким номером не найден\" }));\n      return wait(700, { ok: true, terminalId: 40219, terminalName: term.terminalName, storeName: term.storeName });\n    }\n    if (name === \"terminal\") return wait(400, { terminal: term, last_payment: this.mockTx() });\n    return wait(500, { terminal: term, count: this.mockList.length, payments: this.mockList });\n  }\n\n  mockTx() {\n    const pool = [245, 80, 159, 460.5, 1234.5, 75, 680, 312];\n    return {\n      sender: String(1 + Math.floor(Math.random() * 4)),\n      amount: pool[Math.floor(Math.random() * pool.length)],\n      status: \"success\",\n      creation_datetime: new Date().toISOString()\n    };\n  }\n\n  applyTerminal(t) {\n    if (!t) return;\n    this.setState({\n      storeName: t.storeName || \"\", terminalName: t.terminalName || \"\",\n      terminalPhone: t.terminalPhone || \"\", terminalQR: t.terminalQR || \"\",\n      terminal: t.terminalName || \"—\"\n    });\n  }\n\n  applyPayments(list) {\n    const ops = (list || []).map(normTx).sort((a, b) => b.ts - a.ts);\n    this.setState({ ops: ops, lastPay: ops.find((o) => o.status === \"success\") || null, sinceSync: 0, syncOk: true });\n  }\n\n  loadTerminal() {\n    return this.api(\"terminal\", {}).then((r) => {\n      this.applyTerminal(r && r.terminal);\n      if (r && r.last_payment) this.setState({ lastPay: normTx(r.last_payment, 0) });\n    });\n  }\n\n  pollHistory() {\n    this.setState({ sinceSync: 0 });\n    return this.api(\"history\", {})\n      .then((r) => { this.applyTerminal(r && r.terminal); this.applyPayments(r && r.payments); })\n      .catch(() => this.setState({ syncOk: false }));\n  }\n\n  mode() { return \"phone\"; }\n\n  aKey(k) {\n    const s = this.state;\n    if (s.aLoading) return;\n    const field = s.aStep === \"phone\" ? \"phone\" : \"code\";\n    const max = field === \"phone\" ? 9 : 4;\n    if (k === \"del\") return this.setState({ [field]: s[field].slice(0, -1), aErr: \"\" });\n    if (s[field].length >= max) return;\n    const next = s[field] + k;\n    this.setState({ [field]: next, aErr: \"\" });\n    if (field === \"phone\" && next.length === 9) this.at = setTimeout(() => this.doLogin(), 250);\n  }\n\n  doLogin() {\n    const s = this.state;\n    if (s.phone.length < 9 || s.aLoading) return;\n    this.setState({ aLoading: true, aErr: \"\" });\n    this.api(\"login\", { phone: this.fullPhone() })\n      .then((r) => this.openShift(r))\n      .catch((e) => this.setState({\n        aLoading: false,\n        aErr: e && e.code === 404 ? \"Терминал с таким номером не найден.\"\n          : e && e.code === 403 ? \"Терминал не подключён к ActivBank QR.\"\n          : (e && e.detail) || \"Нет связи с сервером. Проверьте интернет.\"\n      }));\n  }\n\n  openShift(r) {\n    const d = r || {};\n    this.setState({\n      aLoading: false, authed: true, aErr: \"\", sinceSync: 0, syncOk: true, tab: \"home\",\n      storeName: d.storeName || \"\", terminalName: d.terminalName || \"\", terminal: d.terminalName || \"—\"\n    });\n    this.loadTerminal().catch(() => {});\n    this.pollHistory();\n  }\n\n  logout() {\n    clearTimeout(this.at); clearTimeout(this.pt);\n    this.setState({ authed: false, aStep: \"phone\", code: \"\", pass: \"\", aErr: \"\", aLoading: false, screen: \"list\", selId: null, amount: \"\" });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isPass = this.mode() === \"pass\";\n    const isCode = !isPass && s.aStep === \"code\";\n    const isPhone = !isPass && s.aStep === \"phone\";\n    const d = s.phone.padEnd(9, \"·\");\n    const phoneReady = s.phone.length === 9;\n    const passReady = !!s.login.trim() && s.pass.length >= 4;\n    const authReady = isPhone ? phoneReady : isCode ? s.code.length === 4 : passReady;\n\n    const conn = this.props.connection ?? \"Онлайн\";\n    const off = conn === \"Нет связи\";\n    const shaky = conn === \"Нестабильно\";\n    const okSync = s.syncOk && !off;\n\n    const counts = { \"Все\": s.ops.length };\n    [\"success\", \"pending\", \"declined\", \"refunded\"].forEach((k) => {\n      counts[ST[k].label] = s.ops.filter((o) => o.status === k).length;\n    });\n    const visible = s.filter === \"Все\" ? s.ops : s.ops.filter((o) => ST[o.status].label === s.filter);\n    const okTotal = s.ops.filter((o) => o.status === \"success\").reduce((a, o) => a + o.amount, 0);\n    const sel = s.ops.find((o) => o.id === s.selId) || null;\n    const last = s.lastPay || s.ops.find((o) => o.status === \"success\") || null;\n\n    const payload = s.terminalQR || \"\";\n    const real = this.qrGrid(payload);\n    let qrN = 25, cellsQr = [];\n    if (real) {\n      qrN = real.n;\n      for (let i = 0; i < real.bits.length; i++) cellsQr.push({ c: real.bits[i] ? \"#16181A\" : \"transparent\" });\n    } else {\n      cellsQr = this.placeholderQr();\n    }\n\n    return {\n      qrN: qrN,\n      /* вход */\n      showLogin: !s.authed,\n      authPhone: isPhone, authCode: isCode, authPass: isPass, showKeypad: !isPass,\n      tabPhoneBg: isPass ? \"transparent\" : \"#FFFFFF\",\n      tabPhoneFg: isPass ? \"#6B7075\" : \"#16181A\",\n      tabPassBg: isPass ? \"#FFFFFF\" : \"transparent\",\n      tabPassFg: isPass ? \"#16181A\" : \"#6B7075\",\n      pickPhone: () => this.setState({ aMode: \"phone\", aStep: \"phone\", aErr: \"\", code: \"\" }),\n      pickPass: () => this.setState({ aMode: \"pass\", aErr: \"\" }),\n      phoneMask: d.slice(0, 2) + \" \" + d.slice(2, 5) + \" \" + d.slice(5, 7) + \" \" + d.slice(7, 9),\n      phoneBorder: phoneReady ? \"#0E8F6F\" : \"#E2E2DE\",\n      codeSub: \"Код отправлен по SMS на +992 \" + d.slice(0, 2) + \" ··· \" + d.slice(7, 9),\n      codeCells: [0, 1, 2, 3].map((i) => ({\n        ch: s.code[i] || \"\",\n        border: s.aErr ? \"#E3A9A5\" : i === s.code.length ? \"#0E8F6F\" : \"#E2E2DE\"\n      })),\n      backToPhone: () => this.setState({ aStep: \"phone\", code: \"\", aErr: \"\" }),\n      resendLabel: s.resendIn > 0 ? \"Код снова через \" + s.resendIn + \" с\" : \"Отправить код снова\",\n      resendColor: s.resendIn > 0 ? \"#9AA0A6\" : \"#0E8F6F\",\n      resend: () => this.doLogin(),\n      loginVal: s.login, passVal: s.pass,\n      passType: s.showPass ? \"text\" : \"password\",\n      passToggleLabel: s.showPass ? \"Скрыть\" : \"Показать\",\n      togglePass: () => this.setState({ showPass: !s.showPass }),\n      setLogin: (e) => this.setState({ login: e.target.value, aErr: \"\" }),\n      setPass: (e) => this.setState({ pass: e.target.value, aErr: \"\" }),\n      authError: !!s.aErr, authErrorText: s.aErr,\n      authKeys: [\"1\", \"2\", \"3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\", \"\", \"0\", \"del\"].map((k) => ({\n        label: k === \"del\" ? \"⌫\" : k,\n        bg: k === \"\" ? \"transparent\" : \"#EAEAE5\",\n        border: \"transparent\",\n        press: k === \"\" ? null : () => this.aKey(k)\n      })),\n      authBtnBg: s.aLoading ? \"#2E3237\" : authReady ? \"#16181A\" : \"#E2E2DE\",\n      authBtnFg: s.aLoading || authReady ? \"#FFFFFF\" : \"#9AA0A6\",\n      authBtnLabel: s.aLoading ? \"Проверяем…\" : isPhone ? \"Продолжить\" : \"Открыть смену\",\n      authSubmit: () => this.doLogin(),\n\n\n      /* история */\n      clockStr: hhmm(s.now),\n      netStr: off ? \"нет сети\" : shaky ? \"2G\" : \"4G\",\n      listRef: this.listRef,\n      pullStart: this.pullStart, pullMove: this.pullMove, pullEnd: this.pullEnd, pullWheel: this.pullWheel,\n      pullH: Math.round(s.pull),\n      pullText: s.pulling ? \"GET /pos/history…\" : s.pull >= 56 ? \"отпустите — запрос уйдёт\" : s.pull > 0 ? \"потяните вниз\" : !s.syncOk ? \"последний запрос не прошёл\" : \"\",\n      pullColor: !s.syncOk && !s.pulling && s.pull === 0 ? \"#B3352F\" : \"#9AA0A6\",\n      rows: visible.map((o) => {\n        const st = ST[o.status];\n        return {\n          time: o.time, sum: money(o.amount), payer: o.payer, status: st.label,\n          chipBg: st.bg, chipFg: st.fg, edge: st.dot,\n          sumColor: o.status === \"success\" ? \"#16181A\" : \"#6B7075\",\n          open: () => this.setState({ selId: o.id })\n        };\n      }),\n      noRows: visible.length === 0,\n      emptyText: \"Пока нет операций. Потяните список вниз, чтобы обновить.\",\n\n      /* деталь */\n      hasSel: !!sel,\n      selStatus: sel ? ST[sel.status].label : \"\",\n      selChipBg: sel ? ST[sel.status].bg : \"#F0F0EC\",\n      selChipFg: sel ? ST[sel.status].fg : \"#6B7075\",\n      selSum: sel ? money(sel.amount) : \"\",\n      selId: sel ? \"статус бэка: \" + sel.status : \"\",\n      selFields: sel ? [\n        { k: \"Дата\", v: sel.date },\n        { k: \"Время\", v: sel.time },\n        { k: \"Банк-отправитель\", v: sel.bank },\n        { k: \"sender\", v: String(sel.sender) },\n        { k: \"Терминал\", v: s.terminalName || s.terminal },\n        { k: \"Точка\", v: s.storeName || \"—\" }\n      ] : [],\n      selTrail: sel ? [\n        { name: \"QR создан\", time: sel.time, dot: \"#9AA0A6\" },\n        { name: \"Клиент отсканировал\", time: sel.time, dot: sel.status === \"expired\" ? \"#E2E2DE\" : \"#9AA0A6\" },\n        { name: ST[sel.status].label, time: sel.time, dot: ST[sel.status].dot }\n      ] : [],\n      recheckLabel: okSync ? \"Обновить из /pos/history\" : \"Нет связи — повторить\",\n      recheck: () => this.pollHistory(),\n      closeSel: () => this.setState({ selId: null }),\n      noSel: !sel,\n\n      /* вкладки и единый QR */\n      isHome: s.tab === \"home\", isHistory: s.tab === \"history\",\n      goHistory: () => this.setState({ tab: \"history\" }),\n      tabs: [\n        { name: \"Главная\", key: \"home\", radius: \"4px\" },\n        { name: \"История\", key: \"history\", radius: \"9px\" }\n      ].map((t) => ({\n        name: t.name, radius: t.radius,\n        bg: s.tab === t.key ? \"#FDECEC\" : \"transparent\",\n        fg: s.tab === t.key ? \"#D6202A\" : \"#9AA0A6\",\n        pick: () => this.setState({ tab: t.key, selId: null })\n      })),\n      qr: cellsQr,\n      merchant: s.storeName || \"Кафе «Рохат»\",\n      merchantId: \"терминал \" + (s.terminalName || \"—\") + \" · +\" + (s.terminalPhone || this.fullPhone()),\n      qrPayload: s.terminalQR || (this.base() ? \"ждём terminalQR с сервера\" : \"статический QR терминала\"),\n      todaySum: money(okTotal),\n      todayCount: String(s.ops.filter((o) => o.status === \"success\").length),\n      lastPayStr: last ? bankName(last.sender) + \" · \" + last.time : \"платежей ещё нет\",\n      lastPaySum: last ? \"+\" + money(last.amount) : \"—\",\n      goHome: () => this.setState({ tab: \"home\" }),\n      logout: () => this.logout()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
